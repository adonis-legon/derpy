# =============================================================================
# CI/CD Pipeline for derpy-tool
# =============================================================================
# This workflow automates testing, building, and publishing the derpy-tool
# Python package to PyPI. It runs on pull requests (test only) and on pushes
# to main (test, build, and publish).
#
# Workflow Stages:
# 1. Test: Run pytest across Python 3.8-3.12 (all events)
# 2. Build: Create wheel and source distribution (push to main only)
# 3. Publish: Upload package to PyPI (push to main only)
#
# =============================================================================

name: CI/CD Pipeline

# Trigger Configuration
# - pull_request: Runs tests when PR is opened/updated targeting main
# - push: Runs full pipeline (test → build → publish) when code is merged to main
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Prevent duplicate workflow runs for the same branch/PR
# This cancels in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Test Job
  # ===========================================================================
  # Purpose: Validate code quality across multiple Python versions
  # Runs on: All events (pull requests and pushes to main)
  # Strategy: Matrix testing across Python 3.8, 3.9, 3.10, 3.11, 3.12
  # Exit Criteria: All tests must pass for all Python versions
  # ===========================================================================
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Test across all supported Python versions to ensure compatibility
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment with pip caching for faster runs
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # Cache pip dependencies to speed up workflow

      # Step 3: Install package with development dependencies
      # This includes pytest, pytest-cov, and other testing tools
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Step 4: Run the complete test suite
      # If any test fails, the workflow will fail and block deployment
      - name: Run tests with pytest
        run: pytest

  # ===========================================================================
  # Build Job
  # ===========================================================================
  # Purpose: Create distributable Python package (wheel and source distribution)
  # Runs on: Push to main branch only (not on pull requests)
  # Dependencies: Requires test job to complete successfully
  # Outputs: Wheel (.whl) and source distribution (.tar.gz) files
  # ===========================================================================
  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test # Only runs if all tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 (stable version for building)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install build tools
      # The 'build' package is the official PyPA tool for building Python packages
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Step 4: Build the package
      # Creates both wheel (.whl) and source distribution (.tar.gz) in dist/
      # Package name is "derpy-tool" as configured in pyproject.toml
      - name: Build package
        run: python -m build

      # Step 5: Upload build artifacts for the publish job
      # Artifacts are stored for 90 days by default
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # ===========================================================================
  # Publish Job
  # ===========================================================================
  # Purpose: Upload package to PyPI for public distribution
  # Runs on: Push to main branch only (not on pull requests)
  # Dependencies: Requires build job to complete successfully
  # Authentication: Uses GitHub Environment "pypi" for credential management
  #
  # REQUIRED SETUP (Manual Configuration):
  # ---------------------------------------
  # 1. Create GitHub Environment:
  #    - Navigate to: Repository → Settings → Environments
  #    - Click "New environment"
  #    - Name: "pypi" (must match environment name below)
  #
  # 2. Configure PyPI Authentication (choose ONE method):
  #
  #    METHOD A - API Token (Traditional):
  #    - Go to https://pypi.org/manage/account/token/
  #    - Create new API token scoped to "derpy-tool" project
  #    - In GitHub environment "pypi", add secret:
  #      * Name: PYPI_API_TOKEN
  #      * Value: [your PyPI token]
  #
  #    METHOD B - Trusted Publishing (Recommended):
  #    - Go to PyPI project settings for "derpy-tool"
  #    - Add GitHub as trusted publisher with:
  #      * Owner: [your-github-username]
  #      * Repository: [your-repo-name]
  #      * Workflow: ci-cd.yaml
  #      * Environment: pypi
  #    - No secrets needed (uses OIDC tokens automatically)
  #
  # 3. Optional Environment Protection:
  #    - Add required reviewers for deployment approval
  #    - Set wait timer before deployment
  #    - Restrict to main branch only
  #
  # ===========================================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build # Only runs if build succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: pypi # Uses GitHub Environment for credential management
    permissions:
      id-token: write # Required for trusted publishing (OIDC tokens)

    steps:
      # Step 1: Download build artifacts from the build job
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      # Step 2: Publish package to PyPI
      # This action automatically handles authentication using either:
      # - PYPI_API_TOKEN secret from the "pypi" environment, OR
      # - Trusted publishing via OIDC (if configured on PyPI)
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
